<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradient for the text and border -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#92FE9D" />
    </linearGradient>
    
    <!-- Gradient for the background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Decorative outer circle -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-dasharray="15 15" opacity="0.8"/>
  <circle cx="250" cy="250" r="150" fill="none" stroke="url(#brandGrad)" stroke-width="2" opacity="0.3"/>

  <!-- KS Monogram -->
  <text 
    x="250" 
    y="250" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="180" 
    font-weight="900" 
    fill="url(#brandGrad)" 
    text-anchor="middle" 
    dominant-baseline="central" 
    letter-spacing="-10">
    KS
  </text>
</svg>
